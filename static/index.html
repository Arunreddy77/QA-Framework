<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QA Framework</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page-body">
  <h1>Submit a requirement</h1>
  <p class="secondary">Paste a BRD, Jira ticket, user story or acceptance criteria. The pipeline runs S1 through S9, and pauses for your review whenever it needs a human decision.</p>

  <label>Requirement text</label>
  <textarea id="requirementText" rows="14" placeholder="Title: ...&#10;&#10;Description: ...&#10;&#10;Acceptance Criteria:&#10;- ..."></textarea>

  <div class="flex-between mt-lg">
    <p class="muted" style="margin:0;">⏱ Typical run: 2–6 minutes, plus your time at any review gate</p>
    <button class="btn-primary" id="submitBtn">Submit requirement</button>
  </div>

  <h2 class="mt-lg hairline-top" style="padding-top:1.6rem;">Recent runs</h2>
  <div id="recentRuns" class="muted">Loading…</div>
</div>

<script src="/static/lib.js"></script>
<script>
document.getElementById("nav").innerHTML = topbarNav("New run");

async function loadRecent() {
  const box = document.getElementById("recentRuns");
  try {
    const runs = await api("/dashboard");
    const rows = runs.recent_runs.slice(0, 6);
    if (!rows.length) { box.innerHTML = `<p class="muted">No runs yet -- submit one above to get started.</p>`; return; }
    box.innerHTML = rows.map(r => `
      <a href="/static/${r.status === 'paused_at_h1' ? 'h1.html' : 'report.html'}?id=${r.run_id}" style="text-decoration:none;color:inherit;">
      <div class="card flex-between" style="margin-bottom:0.6rem;">
        <div>
          <div style="font-weight:700;">${escapeHtml(r.title)}</div>
          <div class="muted" style="font-size:0.78rem;">${fmtDate(r.mtime)} · run ${r.run_ref}</div>
        </div>
        ${statusChipHtml(r.status)}
      </div></a>`).join("");
  } catch (e) {
    box.innerHTML = `<p class="muted">Couldn't load recent runs (${escapeHtml(e.message)}).</p>`;
  }
}
loadRecent();

document.getElementById("submitBtn").addEventListener("click", async () => {
  const text = document.getElementById("requirementText").value;
  if (!text.trim()) { alert("Paste a requirement first."); return; }
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  try {
    const { run_id } = await api("/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ requirement: text }),
    });
    location.href = `/static/run.html?id=${run_id}`;
  } catch (e) {
    alert("Couldn't start run: " + e.message);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
